[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabicl-regressor-pipeline"
version = "0.1.0"
description = "Public reference API for the DIMER TabICLv2 regressor pipeline contract"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
