name: Relay sample pin remediation

on:
  push:
    branches: [feat/add-sample-datasets]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-sample-datasets
          fetch-depth: 0
      - name: Pin sample asset revision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tutorials/tabiclv2_regressor_colab.ipynb')
          original = path.read_text(encoding='utf-8')
          indent = 1 if '\n "cells"' in original else 2
          nb = json.loads(original)
          old_url = 'https://raw.githubusercontent.com/kurtvalcorza/tabicl-regressor-pipeline/main/examples/sample-data/insurance-medical-charges.zip'
          pinned_url = 'https://raw.githubusercontent.com/kurtvalcorza/tabicl-regressor-pipeline/ec4d9e88846aac5dc478975c698703d38737575a/examples/sample-data/insurance-medical-charges.zip'

          for cell in nb.get('cells', []):
              source = cell.get('source', '')
              text = ''.join(source) if isinstance(source, list) else source
              if isinstance(text, str):
                  cell['source'] = text.replace(old_url, pinned_url)

          path.write_text(json.dumps(nb, indent=indent, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/relay-sample-remediation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tutorials/tabiclv2_regressor_colab.ipynb
          git commit -m "fix(tutorials): pin regressor sample assets"
          git push origin HEAD:feat/add-sample-datasets
