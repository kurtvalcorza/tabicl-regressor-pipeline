name: One-shot notebook reproducibility fix

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rewrite notebook JSON
        run: python scripts/fix_notebook_repro.py
      - name: Commit migrated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/tabiclv2_regressor_colab.ipynb tutorials/tabiclv2_regressor_artifact_inference_colab.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes needed"
            exit 0
          fi
          git commit -m "fix(notebooks): close build isolation and source hygiene gaps"
          git push origin HEAD:fix/notebook-spec-v1-conformance
