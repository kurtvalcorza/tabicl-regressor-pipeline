name: Apply NOTEBOOK_SPEC v1.0 migration

on:
  push:
    branches:
      - fix/notebook-spec-v1-conformance

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.head_commit.message != 'chore(notebooks): apply NOTEBOOK_SPEC v1.0 conformance' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply migration
        run: python scripts/apply_notebook_spec_v1.py
      - name: Remove one-shot migration machinery
        run: |
          rm scripts/apply_notebook_spec_v1.py
          rm .github/workflows/apply-notebook-spec-v1.yml
      - name: Commit migration result
        run: |
          git config user.name "agent-relay-builder"
          git config user.email "102845719+kurtvalcorza@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "chore(notebooks): apply NOTEBOOK_SPEC v1.0 conformance"
            git push origin HEAD:fix/notebook-spec-v1-conformance
          fi
