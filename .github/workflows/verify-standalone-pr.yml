name: Verify standalone PR

on:
  push:
    branches:
      - feat/standalone-notebook
    paths:
      - .github/workflows/verify-standalone-pr.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.5.3 pandas==2.3.3 scikit-learn==1.9.0 pyarrow==25.0.1 'pytest>=8,<9' ruff==0.16.6
      - run: pip install -e . --no-deps
      - run: ruff check src tests tools
      - run: pytest -q
      - run: python scripts/validate_colab_tutorial.py
      - run: python scripts/test_colab_csv_headers.py
      - run: python scripts/test_issue10_hardening.py
      - run: python tools/validate_release_assets.py
      - run: |
          python tools/build_notebook.py --check
          python tools/build_notebook.py --check --template tools/notebook_template_artifact_inference.py
      - run: python -m compileall -q scripts src tools
